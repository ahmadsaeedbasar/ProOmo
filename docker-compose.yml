version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: proomo_db
      POSTGRES_USER: proomo_user
      POSTGRES_PASSWORD: proomo_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proomo_user -d proomo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: your_django_secret_key_here # IMPORTANT: Change this in production
      DJANGO_DEBUG: "True"
      POSTGRES_DB: proomo_db
      POSTGRES_USER: proomo_user
      POSTGRES_PASSWORD: proomo_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: "https://ssezibwijzevjfikyzzm.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzZXppYndijanpldmpmaWt5enptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxNTM1MTIsImV4cCI6MjA3NzcyOTUxMn0.qEOFYxtWpum4ChT_pOLsSLW0Xc-61oPZuK2CShgyPR0"
      NODE_ENV: development
    depends_on:
      - backend

volumes:
  postgres_data: